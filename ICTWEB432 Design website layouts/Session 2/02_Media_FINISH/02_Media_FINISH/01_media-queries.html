<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries</title>
    <!-- 1. MEDIA QUERIES -->
    <!-- PURPOSE: To apply different styles for different media types/devices - they are a popular technique for delivering a tailored style sheets (responsive web design) to desktops, laptops, tablets, and mobile phones.

      - MEDIA QUERIES use the @media rule to include a block of CSS properties only if a certain condition is true

      - Media queries can be used to check many things, such as:
        - width and height of the viewport
        - width and height of the device
        - orientation (is the tablet/phone in landscape or portrait mode?)
        - resolution
    -->

    <!-- 2. PROCESS TO USING @MEDIA PROPERLY
      - Use a mixture of "min-width" & "max-width"
      - Scale from the smallest viewport size and scale up
      - We ALTER our CSS to target the smaller device sizes, so remove wide images, avoid repetitive items & ensure long horizontal UI becomes vertical OR hidden!
    -->

    <!-- 3. TESTING MOBILE RESPONSIVENESS: DEVTOOLS - Device Toolbar 
      - Most modern browsers include devtool support for simulating the webpage in different devices for all shapes and sizes

      - STEPS:
        - a. Open up Elements Panel inside Browser DevTools (Ctrl + Alt + I)

        - b. Next to the "Elements" tab, there is a little button called "Toggle Device Toolbar" -> CLICK THIS

        - c. KEY BREAKPOINTS: Opens up Device Panel where you can select different dimensions according to popular devices OR custom dimensions:
          -> MOBILE: iPhone 12 Pro (390 x 844)
          -> TABLET: iPad Mini (768 x 1024)
          -> DESKTOP: Nest Hub (1024 x 600) or Nest Hub Max (1280 x 800)


      - 4. OPTIMAL RESOLUTION BREAKPOINTS:
        - LEARNING - Just try to target a MOBILE breakpoint (max-width of 480px) + DESKTOP breakpoint (min-width of 481px)

        - PROGRESSION - Add TABLETS breakpoint (min-width 481px and max-width 768px) + alter DESKTOP (min-width of 769px)

        - ADVANCED - You can add even more niche breakpoints for small & large MOBILES (320px, 480px) + standard & landscape TABLETS (768px, 1024px) + WIDESCREEN DESKTOP (1200px +)

        -> RESOURCES:
          - Breakpoint Design Overview: https://medium.com/theymakedesign/breakpoints-in-web-design-4e3b334066e8
          - Common Resolutions: https://www.designrush.com/agency/web-development-companies/trends/website-dimensions
    -->
    <style>
      /* CSS Base */
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: gray;
        color: white;
        text-align: center;
        padding-top: 100px;
      }
      h1 {
        display: none;
      }

      /* 1a. Desktop (Widescreen) */
      @media (min-width: 1201px) {
        body {
          background: black;
        }
        .widescreen h1 {
          display: block;
        }
      }

      /* 1b. Desktop (standard) */
      @media (min-width: 769px) and (max-width: 1200px) {
        body {
          background: green;
        }
        .normal h1 {
          display: block;
        }
      }

      /* 1c. Tablet */
      @media (min-width: 481px) and (max-width: 768px) {
        body {
          background: blue;
        }
        .tablet h1 {
          display: block;
        }
      }

      /* 1d. Mobile */
      @media (max-width: 480px) {
        body {
          background: red;
        }
        .smartphone h1 {
          display: block;
        }
      }

      /* 1e. EXAMPLE: Target Vertical Landscape */
      @media (max-height: 500px) {
        body {
          background: orange;
        }
        .landscape h1 {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="widescreen"><h1>Widescreen</h1></div>
    <div class="normal"><h1>Normal</h1></div>
    <div class="tablet"><h1>Tablet</h1></div>
    <div class="smartphone"><h1>Smartphone</h1></div>
    <div class="landscape"><h1>Landscape</h1></div>
  </body>
</html>
