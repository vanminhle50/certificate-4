<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display - Grid</title>
  <!-- 1. GRID:
    - OVERVIEW - CSS GRID is yet ANOTHER "layout algorithm"
    - CSS is comprised of several different layout algorithms, each designed to distribute content in a consistent manner on the webpage

    - PURPOSES:
      - Flow Layout (default) -> Designed for digital documents
      - Tables -> Designed for tabular data
      - Flexbox -> Designed for distributing items along a SINGLE AXIS
      - GRID -> Designed for creating complex layouts that can adapt along HORIZONTAL and VERTICAL AXIS
  -->

  <!-- 2. SETUP OF GRID 
    - I. GRID is made up of two parts: the parent div ("grid-container") and the child elements ("grid-items")
      -> This is like flex, which has "flex-container" & "flex-items"

    - II. Like FLEX, we set our RULES in the parent, which dictates the behaviour of the items
      -> We will look at: grid-template-rows/columns, grid-gaps & grid-template-areas in 03

    - III. GRIDs set the items by default into ONE COLUMN, with each item taking up a ROW each
      -> Grid = remember ROW & COL!
      -> CONTRAST: Unlike flexbox, we don't set the direction.  Rather, we CONSTRUCT gridlines for our layout to "stick to"!
  -->

  <!-- 3. GRID FIRST PRINCIPLES & BEHAVIOUR: Go to [1] BELOW -->

  <!-- 4. GRID RESOURCES:
    - Interactive Grid Tutorial: https://www.joshwcomeau.com/css/interactive-guide-to-grid/
    - Grid Properties Step-by-Step: https://learncssgrid.com/
    - Grid Cheatsheet: https://css-tricks.com/snippets/css/complete-guide-grid/
  -->

  <style>
    /* GENERAL STYLES */
    /* NOTE: Default layout dictates "flow" - which means, these boxes are BLOCK, so extent to viewport width + FLOW one after the other, in order of the markup! */
    :root {
      --paradise: #EF476F;
      --crayola: #FFD166;
      --green: #06D6A0;
      --powder: #FFEABA;
    }
    body {
      background-color: var(--powder);
      text-align: center;
      max-width: 1024px;
      margin: 1rem auto;
      font-weight: 800;
      font-family: system-ui, -apple-system, sans-serif;
    }
    section {
      margin: 4rem;
      border: 5px solid black;
    }
    .box {
      padding: 2rem;
      /* flex-grow: 1; */
    }
    .red {
      background-color: var(--paradise);
    }
    .yellow {
      background-color: var(--crayola);
    }
    .green {
      background-color: var(--green);
    }
    /* [1] GRID SETUP 
      - By default, GRID items are placed in ROWS within a SINGLE COLUMN and span the full width of the grid container
    */
    .grid-container-1 {
      display: grid;
    }
    /* [2] GRID ITEMS WITHIN CONTAINER 
      - Unlike other layout systems, including flex, grid items will adjust to FILL ALL THE AVAILABLE SPACE
      - By default, flex only takes up the space it needs on its main axis
      - TOGGLE: Comment out one of the boxes AND SEE how the grid adjusts to keep filling the space!
      - CONTRAST: Flexbox items ONLY take up the space they need to display the content OR meet width/height amounts
    */
    .grid-container-2 {
      display: grid;
      height: 500px;
    }
    /* [3] GRID vs. FLEX
      - FOUR MAIN DIFFERENCES:
        - a. AXIS: Flexbox needs to set a primary axis.  It can target its off-axis, but limited.  Grid construction targets both at once.
        - b. SPACE: Flexbox items only take up space they need to display the content OR meet width/height amounts - even use of properties like "justify" preserve the empty space.  Grid items FILL available space.
          -> You can make flex items fill space, by targeting the children and making "flex-grow: 1;" (see above)
        - c. COMPLEXITY: Flexbox can make basic layouts, that have items which flow in a set direction.  Grids can make very complex layouts.
        - d. MARKUP: Flexbox generally needs to structure HTML carefully to set children.  Grid is ONLY layout tool that allows us to manage layout PURELY with CSS!

        -> SEE 03 for another, in-depth example!
    */
    .flex-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 500px;
      /* See box for "flex-grow" */
    }
  </style>
</head>
<body>
  <!-- 1. GRID CONTAINER -->
  <section class="grid-container-1">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 2. GRID ITEMS -->
  <section class="grid-container-2">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 3. FLEX ITEMS -->
  <section class="flex-container">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>
</body>
</html>
