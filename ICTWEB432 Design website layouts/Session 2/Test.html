<div class="grid-container">
    <div class="full-width">Ô hàng 1 (Full rộng)</div>
    <div class="small-box">Ô hàng 2 - Cột 1 (nhỏ hơn)</div>
    <div class="big-box">Ô hàng 2 - Cột 2 (rộng gấp đôi)</div>
  </div>
  
  <style>
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    grid-template-rows: auto auto;
    gap: 10px;
  }
  
  .full-width {
    grid-column: 1 / 3; /* Kéo dài qua 2 cột */
    background: lightblue;
    padding: 20px;
  }
  
  .small-box {
    background: lightgreen;
    padding: 20px;
  }
  
  .big-box {
    background: lightcoral;
    padding: 20px;
  }
  
  /* Responsive: Khi màn hình nhỏ hơn 600px */
  @media (max-width: 600px) {
    .grid-container {
      grid-template-columns: 1fr; /* 1 cột duy nhất */
    }
  
    .full-width {
      grid-column: 1; /* Không cần kéo dài 2 cột nữa */
    }
  }
  </style>
