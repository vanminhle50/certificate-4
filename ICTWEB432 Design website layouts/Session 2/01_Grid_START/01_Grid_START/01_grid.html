<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display - Grid</title>
  <!-- 1. GRID: ANOTHER "layout algorithm" -->

  <style>
    /* GENERAL STYLES */
    /* NOTE: Default layout dictates "flow" - which means, these boxes are BLOCK, so extent to viewport width + FLOW one after the other, in order of the markup! */
    :root {
      --paradise: #EF476F;
      --crayola: #FFD166;
      --green: #06D6A0;
      --powder: #FFEABA;
    }
    body {
      background-color: var(--powder);
      text-align: center;
      max-width: 1024px;
      margin: 1rem auto;
      font-weight: 800;
      font-family: system-ui, -apple-system, sans-serif;
    }
    section {
      margin: 4rem;
      border: 5px solid black;
    }
    .box {
      padding: 2rem;
    }
    .red {
      background-color: var(--paradise);
    }
    .yellow {
      background-color: var(--crayola);
    }
    .green {
      background-color: var(--green);
    }
    /* [1] GRID SETUP */
    .grid-container-1 {
      
    }
    /* [2] GRID ITEMS WITHIN CONTAINER */
    .grid-container-2 {
      
    }
    /* [3] GRID vs. FLEX
      -> SEE 03 for another, in-depth example!
    */
    .flex-container {
      
    }
  </style>
</head>
<body>
  <!-- 1. GRID CONTAINER -->
  <section class="grid-container-1">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 2. GRID ITEMS -->
  <section class="grid-container-2">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 3. FLEX ITEMS -->
  <section class="flex-container">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>
</body>
</html>
