<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Construction</title>
  <!-- GRID "TEMPLATE" CONSTRUCTION - GOLDEN RULE: We need to structure our grid in CSS, which tells our HTML to behave along the CSS gridlines!-->
  <style>
    /* GENERAL STYLES */
    :root {
      --paradise: #EF476F;
      --crayola: #FFD166;
      --green: #06D6A0;
      --powder: #FFEABA;
    }
    body {
      background-color: var(--powder);
      text-align: center;
      max-width: 1024px;
      margin: 1rem auto;
      font-weight: 800;
      font-family: system-ui, -apple-system, sans-serif;
    }
    section {
      margin: 4rem;
      border: 5px solid black;
    }
    .box {
      padding: 2rem;
    }
    .red {
      background-color: var(--paradise);
    }
    .yellow {
      background-color: var(--crayola);
    }
    .green {
      background-color: var(--green);
    }

    /* [1] GRID COLS & ROWS */
    .grid-container-1 {
      display: grid;
      
    }
    /* [2] GRID GAPS */
    .grid-container-2 {
      display: grid;
    }
    /* [3] GRID SPANNING */
    .grid-container-3 {
      display: grid;
    }
    /* [4] GRID TEMPLATE AREAS */
    .grid-container-4 {
      display: grid;
    }
  </style>
</head>
<body>
  <!-- 1. GRID COLUMNS & ROWS -->
  <section class="grid-container-1">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 2. GRID GAPS -->
  <section class="grid-container-2">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 3. GRID SPANNING -->
  <section class="grid-container-3">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>

  <!-- 3. GRID TEMPLATE AREAS -->
  <section class="grid-container-4">
    <div class="box red">1</div>
    <div class="box yellow">2</div>
    <div class="box green">3</div>
  </section>
</body>
</html>
