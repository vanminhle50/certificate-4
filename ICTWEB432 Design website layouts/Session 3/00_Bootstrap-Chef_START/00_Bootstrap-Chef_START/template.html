        - (b) Custom footer - show how we can just use utilities to help us to style our markup

        - (c) Other useful components (brief) - alerts, buttons, carousel, row/col, form, cards


    - HOWEVER - Bootstrap is typically best learned by jumping in headfirst - watching me add & edit Bootstrap, will only get you so far & is a bit boring if done for too long!

      -> You will soon get a series of challenges to build up an entire webpage using Bootstrap!
