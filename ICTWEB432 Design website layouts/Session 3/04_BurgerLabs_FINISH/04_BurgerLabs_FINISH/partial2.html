<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Required meta tags always come first -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap Stylesheet via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/burgerlabs.css">
  <title>Burger Labs</title>
</head>
<body>
  <div class="container">
    <!-- 1. NAVBAR: START -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="./img/LogoBlack.svg" class="icon me-3" />
          BurgerLabs
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- NAV-LINKS Section -->
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Bookings</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Menu</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- 1. NAVBAR: END -->

    <!-- 2. CAROUSEL START -->
    <div id="carousel-hero" class="carousel slide" data-bs-ride="carousel">
      <!-- OPTIONAL: Viewable Carousel toggle controls - back and forward! -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carousel-hero" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carousel-hero" data-bs-slide-to="1" aria-label="Slide 2"></button>
      </div>
      <!-- ACTUAL CAROUSEL OF ITEMS - make sure to actually link an image! -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="./img/Carousel1.jpg" class="d-block w-100" alt="restaurant bar">
        </div>
        <div class="carousel-item">
          <img src="./img/Carousel2.jpg" class="d-block w-100" alt="restaurant front">
        </div>
      </div>
    </div>
    <!-- 2. CAROUSEL END -->

    <!-- 3. ROW ONE: TITLE -->
    <div class="row my-3">
      <div class="col-12">
        <h2 class="display-4">about</h2>
        <hr />
        <h3 class="text-end text-muted lead">meet the chef</h3>
      </div>
    </div>

    <!-- INCORPORATE REMAINING CONTENT INTO PAGE CONTAINER - Follow Preview "Partial" 3 to 4!
      - Partial 3: Incorporate the Content in Row 2, being text content + a form (3 inputs & button) + sidebar image
      - Partial 4 & End: Incorporate three Cards within a flexbox, holding an image, content & button
    -->

    <!-- 4. ROW TWO: TEXT & FORM -->
    <div class="row">
      <!-- Start of Column-Left (8/12) -->
      <div class="col-8">
        text content + form - 8 Col
      </div>
      <!-- End of col-8 -->

      <!-- Start of Column-Right (4/12) -->
      <div class="col-4">
        image - 4 Col
      </div>
      <!-- End of col-4 -->
    </div>

    <!-- 5. ROW THREE: SPECIALS TITLE -->
    <div class="row my-3">
      <div class="col-12">
          <h2 class="display-4">daily specials</h2>
          <hr />
          <h3 class="text-end text-muted lead">
              look at what we have today
          </h3>
      </div>
    </div>

    <!-- 6. ROW FOUR: SPECIALS CARDS -->
    <div class="row">

      <!-- Card 1 -->
      <div class="col-4">
        Card 1 - 4 Col
      </div>
      
      <!-- Card 2 -->
      <div class="col-4">
        Card 2 - 4 Col
      </div>

      <!-- Card 3 -->
      <div class="col-4">
        Card 3 - 4 Col
      </div>
      
    </div>

    <!-- 7. FOOTER -->
    <footer class="footer mt-3 px-4 d-flex flex-row justify-content-between bg-light">
      <p>&copy; BurgerLabs 2024</p>
      <p>Designed by ~ nice<strong>Dev</strong> &#128526;</p>
    </footer>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
