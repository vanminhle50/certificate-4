<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Variables</title>
  <style>
    /* Declaring CSS Variables */


    /* Passing CSS Variables */
    * {
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4rem;
      background: #f4f4f4;
    }
    header {
      background-color: #333333;
      color: #f4f4f4;
      text-align: center;
      border-bottom: 5px #cccccc solid;
      padding: 2rem;
    }
    .container {
      display: flex;
      margin: auto;
      max-width: 1100px;
    }
    .box {
      background-color: #333333;
      border-bottom: 5px #cccccc solid;
      color: #f4f4f4;
      padding: 1rem;
      margin: 1rem;
    }
    .box-1 {
      flex: 3;
    }
    .box-2 {
      flex: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>CSS Variables</h1>
  </header>
  <div class="container">
    <div class="box box-1">
      <h3>Hello World</h3>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor optio
        perspiciatis, sunt dolorum alias ipsam!
      </p>
    </div>
    <div class="box box-2">
      <h3>Hello World</h3>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor optio
        perspiciatis, sunt dolorum alias ipsam!
      </p>
    </div>
  </div>
</body>
</html>
